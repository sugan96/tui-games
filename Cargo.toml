[workspace]
resolver = "3"
members = ["crates/sdk", "crates/launcher", "games/snake", "games/brick-ball"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
rand = "0.10.3"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
arcade-sdk = { path = "crates/sdk" }
